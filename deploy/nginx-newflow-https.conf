# NewFlow - Nginx com HTTPS DIRETO na Raspberry (Let's Encrypt)
# Use ESTE arquivo somente se a PROPRIA Pi vai terminar o TLS (portas 80/443 abertas
# e o dominio newflow.newhybrid.com resolvendo publicamente para o IP da Pi).
#
# Se voce usa Cloudflare Tunnel / proxy na frente apontando para a porta 5011,
# NAO use este arquivo: mantenha o nginx-newflow.conf (HTTP na 5011) e deixe o
# cadeado (TLS) por conta do Cloudflare/proxy.
#
# Passos:
#   sudo cp deploy/nginx-newflow-https.conf /etc/nginx/sites-available/newflow.conf
#   sudo ln -s /etc/nginx/sites-available/newflow.conf /etc/nginx/sites-enabled/
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d newflow.newhybrid.com
#   # o certbot ajusta os caminhos dos certificados automaticamente
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name newflow.newhybrid.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newflow.newhybrid.com;

    # Preenchidos pelo certbot (ou aponte manualmente):
    ssl_certificate     /etc/letsencrypt/live/newflow.newhybrid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newflow.newhybrid.com/privkey.pem;

    root /var/www/newflow;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
