# NewFlow - vhost para dominio proprio com HTTPS via Certbot
#
# SEGURO para conviver com seus outros sites Nginx:
#   - NAO usa "default_server"
#   - NAO usa "server_name _" (catch-all)
#   - eh um server block nomeado (name-based virtual host) so para newflow.newhybrid.com
#   - backend interno em 127.0.0.1:8011 (nao conflita com portas dos outros projetos)
#
# Instalar:
#   sudo cp /opt/newflow/deploy/nginx-newflow-https.conf /etc/nginx/sites-available/newflow.conf
#   sudo ln -s /etc/nginx/sites-available/newflow.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois gere o certificado (o certbot adiciona o bloco 443 e o redirect 80->443 sozinho,
# igual voce ja faz nos outros projetos):
#   sudo certbot --nginx -d newflow.newhybrid.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name newflow.newhybrid.com;

    root /home/rithiele/websites/newflow/public;
    index index.html;

    # upload de imagens (envios/agendamentos)
    client_max_body_size 25M;

    # API -> backend FastAPI (mantem o prefixo /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache de assets
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
