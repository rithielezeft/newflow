# NewFlow - Nginx (porta 5011)
# Serve o frontend (build estático) e faz proxy de /api para o backend NewFlow (uvicorn em 127.0.0.1:8011)
#
# Instalar em: /etc/nginx/sites-available/newflow.conf
# Ativar:      sudo ln -s /etc/nginx/sites-available/newflow.conf /etc/nginx/sites-enabled/
#              sudo nginx -t && sudo systemctl reload nginx

server {
    listen 5011;
    listen [::]:5011;
    server_name newflow.newhybrid.com;

    # Pasta onde ficam os arquivos do build (copie o conteudo de frontend/build para ca)
    root /var/www/newflow;
    index index.html;

    # Permite upload de imagens (agendamentos / envios)
    client_max_body_size 25M;

    # API -> backend FastAPI (mantem o prefixo /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA React - qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estaticos
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
